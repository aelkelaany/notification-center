<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تصور مركز الإشعارات: الواجهة الأمامية والخلفية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* اتجاه التصميم: شاشتان منفصلتان بحالة مشتركة. الأمامية بهيكل منصة الخدمات الإلكترونية (رأس أبيض، بطل أخضر، بطاقات)، والخلفية لوحة إدارة محايدة بشريط جانبي. */
:root{
  --bg:#f2f5f3; --surface:#ffffff; --ink:#18271f; --muted:#56675e; --line:#d9e1dc;
  --green:#17613f; --green-2:#1b7a4b; --green-soft:#e4f1ea; --gold:#a8791f;
  --bad:#a93030; --bad-soft:#fbe9e9; --info:#255f91; --info-soft:#e6f0f8; --navy:#26323a;
  --font:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #1b8354;outline-offset:2px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:500;min-height:36px}
.btn:hover{border-color:var(--green)}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.p:hover{background:#0f4d31}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tag{display:inline-block;font-size:11.5px;font-weight:600;background:var(--green-soft);color:var(--green);border-radius:6px;padding:1px 8px}
.chip{white-space:nowrap;display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600}
.chip.pri{background:var(--bad-soft);color:var(--bad)}
.chip.upd{background:var(--info-soft);color:var(--info)}
.chip.gen{background:var(--green-soft);color:var(--green)}
.chip.done{background:var(--green-soft);color:var(--green)}
.chip.exp{background:#eceeed;color:#55605a}

/* شريط العرض التجريبي */
.demo{position:sticky;top:0;z-index:40;background:#14261d;color:#fff;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:8px 16px}
.demo b{font-size:13px}
.demo .seg{display:inline-flex;border:1px solid #ffffff55;border-radius:8px;overflow:hidden}
.demo .seg button{border:0;background:none;color:#fff;padding:5px 12px;font-weight:500}
.demo .seg button[aria-pressed="true"]{background:#fff;color:#14261d;font-weight:700}
.demo label{font-size:12.5px;display:flex;gap:6px;align-items:center}
.demo select{border:1px solid #ffffff55;border-radius:6px;background:#1f3a2c;color:#fff;padding:3px 6px}
.demo .btn{background:none;border-color:#ffffff55;color:#fff;min-height:30px;padding:3px 12px}
.demo .sp{flex:1}

.stage{display:grid;grid-template-columns:minmax(0,1fr);align-items:start}
.stage[data-view="ben"] #admPane{display:none}
.stage[data-view="adm"] #benPane{display:none}

/* ===== الواجهة الأمامية ===== */
.ben{position:relative;background:#f7f9f8;min-height:calc(100vh - 52px)}
.nm-util{background:#fff;border-bottom:1px solid var(--line);padding:5px 20px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.nm-bar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:0 20px;min-height:68px;flex-wrap:wrap}
.nm-logo{display:flex;flex-direction:column;line-height:1;padding:8px 0}
.nm-logo b{font-size:30px;color:var(--green);font-weight:700}
.nm-logo small{font-size:10px;letter-spacing:.35em;color:var(--green-2);font-weight:600}
.nm-nav{display:flex;gap:2px;align-items:stretch;align-self:stretch;overflow-x:auto;flex:1;min-width:0}
.nm-nav>*{display:flex;align-items:center;padding:0 12px;white-space:nowrap;font-size:13px;color:#2a3a32;border:0;background:none;font-weight:500}
.nm-nav button.on{background:var(--green-2);color:#fff;font-weight:700}
.nm-tools{display:flex;gap:10px;align-items:center;position:relative}
.nm-search{width:210px;border:1px solid #b9c5be;border-radius:6px;padding:6px 10px;color:#7a887f;font-size:12.5px;background:#fff;display:flex;justify-content:space-between;align-items:center}
.nm-search svg{width:15px;height:15px}
.bellwrap{position:relative}
.bell{position:relative;background:#f3f4f6;border:1px solid #dfe5e1;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;color:#2a3a32}
.bell:hover{border-color:var(--green)}
.bell[aria-expanded="true"]{background:var(--green-soft);border-color:var(--green)}
.bell svg{width:19px;height:19px}
.bell .badge{position:absolute;top:-6px;inset-inline-start:-6px;background:#d9534a;color:#fff;font-size:11px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.bell.ping{animation:ping .8s}
@keyframes ping{0%{transform:scale(1)}30%{transform:scale(1.2)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.bell.ping{animation:none}.sw::after{transition:none}.toast{transition:none}}
.user{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:600}
.user i{width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.dd{position:absolute;top:48px;left:0;right:auto;width:360px;max-width:calc(100vw - 32px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 34px #0003;z-index:30;overflow:hidden}
.dd-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.dd-h b{font-size:14px}
.dd-i{display:flex;gap:9px;align-items:flex-start;padding:9px 12px;border-bottom:1px solid #eef2ef;width:100%;text-align:start;border-inline:0;border-top:0;background:#fff}
.dd-i:hover{background:#f6f9f7}
.dd-i.st-new.pri{border-inline-start:4px solid var(--bad)}
.dd-i.st-read,.dd-i.st-done,.dd-i.st-expired{opacity:.75}
.dd-i .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.dd-i .ic svg{width:15px;height:15px}
.dd-i .t{font-weight:600;font-size:12.5px;display:block}
.dd-i small{color:var(--muted);font-size:11.5px}
.dd-f{padding:9px 12px;text-align:center;background:#f9fbfa}
.dd-f button{border:0;background:none;color:var(--green);font-weight:700}
.dd .e{padding:22px 12px;text-align:center;color:var(--muted)}
.hero{background:linear-gradient(135deg,#1d7f4f,#0f5a3a);color:#fff;padding:30px 24px 0}
.hero .in{max-width:980px;margin:0 auto}
.hero h1{font-size:28px;font-weight:700}
.hero p{margin:4px 0 14px;font-size:16px;opacity:.95}
.hero .big{background:#fff;color:#7a887f;border-radius:6px;padding:11px 14px;max-width:560px;display:flex;justify-content:space-between;align-items:center}
.hero .big svg{width:18px;height:18px;flex:none}
.hero .kw{margin:14px 0 6px;font-size:12.5px;opacity:.9}
.hero .kws{display:flex;gap:8px;flex-wrap:wrap}
.hero .kws span{background:#ffffff26;border:1px solid #ffffff55;border-radius:999px;padding:1px 12px;font-size:12px}
.hero h2{font-size:18px;margin:22px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{padding:18px 20px}
.tile b{display:block;font-size:15px}
.tile span{font-size:12.5px;opacity:.85}
.tile:nth-child(1){background:#1a6a44}
.tile:nth-child(2){background:#145336}
.tile:nth-child(3){background:var(--navy)}
@media (max-width:640px){.tiles{grid-template-columns:1fr}}
.sec{max-width:980px;margin:0 auto;padding:26px 24px}
.sec h2{text-align:center;color:var(--green);font-size:22px;margin-bottom:14px}
.cards3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.svc{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px}
.svc b{display:block;margin-bottom:4px}
.svc p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.svc .fake{display:inline-block;background:var(--green-2);color:#fff;border-radius:6px;padding:4px 14px;font-size:12.5px}
.page{max-width:860px;margin:0 auto;padding:22px 20px 40px}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-bottom:6px}.crumb button{background:none;border:0;padding:0;font:inherit;color:var(--green);cursor:pointer;text-decoration:underline}.crumb .sep{color:#9aa8a0}.crumb [aria-current]{color:var(--text,#1c2a22);font-weight:700}
.page h2{font-size:22px;color:var(--green);margin-bottom:2px}
.fil{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.fil button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-weight:500;font-size:12.5px}
.fil button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.tool{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.grp{margin-bottom:16px}
.grp h4{margin:0 0 7px;font-size:12.5px;display:flex;gap:8px;align-items:center;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;display:flex;gap:11px;align-items:flex-start}
.card.pri.st-new{border-inline-start:4px solid var(--bad)}
.card.st-read,.card.st-done,.card.st-expired{opacity:.78}
.ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex:none}
.ic svg{width:17px;height:17px}
.ic.pri{background:var(--bad-soft);color:var(--bad)}
.ic.upd{background:var(--info-soft);color:var(--info)}
.ic.gen{background:var(--green-soft);color:var(--green)}
.card .main{flex:1;min-width:0}
.card .open{display:block;width:100%;text-align:start;border:0;background:none;padding:0}
.card .t{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.st-new .t{font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:#d9534a;display:inline-block}
.card p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.card .meta{display:flex;gap:8px;align-items:center;margin-top:7px;flex-wrap:wrap}
.card .tm{font-size:11.5px;color:var(--muted)}
.ghost{border:0;background:none;color:var(--muted);padding:2px 6px;border-radius:6px;font-size:12px;display:inline-flex;gap:4px;align-items:center}
.ghost:hover{background:#eef2ef;color:var(--ink)}
.ghost svg{width:14px;height:14px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed #b9c5be;border-radius:10px;background:#fff}
.arch{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.login{background:#fff;border:1px solid var(--line);border-radius:10px;padding:30px 16px;text-align:center;max-width:520px;margin:30px auto}
.login p{margin:6px 0 14px;color:var(--muted)}
.toast{position:fixed;left:50%;top:14px;text-align:center;background:#14261d;color:#fff;border-radius:9px;padding:9px 14px;font-size:12.5px;opacity:0;transform:translate(-50%,-10px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:min(520px,92vw)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.dlg{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:16px;z-index:70}
.dlg[hidden]{display:none}
.dlg div.b{background:#fff;border-radius:12px;padding:16px;max-width:340px}
.dlg p{margin:0 0 12px}
.dlg .bt{display:flex;gap:8px;justify-content:flex-end}
.ann{display:none;font-size:10.5px;font-weight:700;background:#fff3d6;color:#7a5200;border:1px solid #ecd9a0;border-radius:5px;padding:0 6px;margin-inline:4px}
body[data-ann="1"] .ann{display:inline-block}

/* ===== الواجهة الخلفية ===== */
.adm{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:calc(100vh - 52px);background:#eef2ef}
@media (max-width:760px){.adm{grid-template-columns:minmax(0,1fr)}}
.side{background:#10261b;color:#fff;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.side .brand{padding:6px 10px 14px;border-bottom:1px solid #ffffff22;margin-bottom:8px}
.side .brand b{font-size:16px;display:block}
.side .brand small{opacity:.7;font-size:11.5px}
.side h5{margin:10px 10px 4px;font-size:11px;opacity:.6;font-weight:600}
.side button{border:0;background:none;color:#e3efe8;text-align:start;padding:9px 12px;border-radius:8px;font-weight:500}
.side button:hover{background:#ffffff14}
.side button[aria-current="page"]{background:#ffffff26;font-weight:700}
.admtop{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.admtop .who{display:flex;gap:8px;align-items:center;font-size:12.5px}
.admtop .who i{width:30px;height:30px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
.admmain{padding:18px 22px 40px}
.admmain>.card2{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}
.card2 h3{font-size:16px;font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hint{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.note:empty{display:none}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}
@media (max-width:1280px){.split{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#f6f8f7;text-align:start;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--green-soft)}
td button.link{border:0;background:none;padding:0;text-align:start;font-weight:600;color:var(--ink)}
td button.link:hover{color:var(--green);text-decoration:underline}
.sw{border:1px solid var(--line);background:#e7ebe9;border-radius:999px;width:42px;height:24px;position:relative;padding:0}
.sw::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0003;transition:inset-inline-start .15s}
.sw[aria-checked="true"]{background:var(--green);border-color:var(--green)}
.sw[aria-checked="true"]::after{inset-inline-start:20px}
form.f{display:flex;flex-direction:column;gap:10px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label,.fld legend{font-weight:600;font-size:12.5px}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{border:1px solid #b9c5be;border-radius:8px;padding:7px 10px;background:#fff;width:100%}
.fld textarea{min-height:64px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
fieldset{border:0;padding:0;margin:0}
.opts{display:flex;gap:6px 14px;flex-wrap:wrap}
.opts label{font-weight:500;display:flex;gap:6px;align-items:center}
code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#eef2ef;border-radius:5px;padding:0 6px;font-size:12px;direction:ltr;unicode-bidi:isolate}
mark{background:#fff1c9;border-radius:4px;padding:0 3px}
.prev-h{font-size:12px;font-weight:600;color:var(--muted);margin:2px 0 6px}
.note{font-size:12.5px;color:var(--muted);background:#f6f8f7;border-radius:8px;padding:8px 10px}
.log{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.log li{font-size:12.5px;padding:6px 10px;border-radius:8px;border:1px solid var(--line)}
.log li.ok{background:var(--green-soft);border-color:#bddbcb}
.log li.dup{background:#fff7e1;border-color:#ecd9a0}
.log li.reject{background:var(--bad-soft);border-color:#eec3c3}
.src{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.src b{font-weight:600}
.src small{display:block;color:var(--muted);font-size:12px}
.src .bt{display:flex;gap:6px;flex-wrap:wrap}
.toast.adm{position:fixed}

.bt{display:flex;gap:8px;flex-wrap:wrap}
.chip.ok{background:var(--green-soft);color:var(--green)}
.chip.warn{background:#fff3d6;color:#7a5200}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ro{background:#fff7e1;color:#6b4e00}
.sub{font-size:14px;margin:18px 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:6px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fafcfb}
.stat b{display:block;font-size:22px;color:var(--green)}
.stat span{font-size:12px;color:var(--muted)}
.bar{display:inline-block;width:70px;height:7px;background:#e4eae6;border-radius:99px;vertical-align:middle;overflow:hidden;margin-inline-end:6px}
.bar i{display:block;height:100%;background:var(--info)}
.bar i.gd{background:var(--green-2)}
.hist{margin:0;padding:0 18px;font-size:12.5px;color:var(--muted)}
.k{display:block;color:var(--muted);font-size:11.5px;font-weight:400}
td.c{text-align:center}
td.e{text-align:center;color:var(--muted);padding:18px}
.opts.col{flex-direction:column;gap:6px;margin:6px 0}
.filebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.tw.small{margin-top:8px}
.linkb{border:0;background:none;color:var(--green);font-weight:700;font-size:12px;padding:0 6px}
.phone{background:#eef2ef;border-radius:14px;padding:12px;max-width:340px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 2px;padding:9px 11px;font-size:13px;white-space:pre-wrap}
.mut{color:var(--muted)}
.review{border:1px solid var(--green);background:var(--green-soft);border-radius:10px;padding:12px}
.review ul{margin:6px 0 10px;padding:0 18px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts input{border:1px solid #b9c5be;border-radius:8px;padding:4px 6px}
.enp .card{direction:ltr;text-align:left}
.admtop select{border:1px solid #b9c5be;border-radius:8px;padding:4px 8px;background:#fff}

.note.warn{background:#fff3d6;color:#6b4e00}
.note.inl{display:inline-flex;gap:8px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:6px;align-items:center;margin-top:6px;font-weight:600}
.blbar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:10px}
@media (max-width:760px){.blbar{grid-template-columns:1fr}}
.pager{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:10px;font-size:12.5px}
td.ph{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;text-align:right}
[hidden]{display:none!important}
.chn{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;margin:1px 2px;white-space:nowrap;border:1px solid var(--line)}
.chn.ok{background:var(--green-soft);color:var(--green);border-color:#bddbcb}
.chn.bad{background:var(--bad-soft);color:var(--bad);border-color:#eec3c3}
.chn.info{background:var(--info-soft);color:var(--info);border-color:#c6d6ea}
.chn.mute{background:#f1f3f2;color:#55605a}
.chs{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
tr.grp td{background:#eef4f0;padding:6px 10px}
.blbar2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:10px;margin-bottom:10px}
.blbar{grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto}
@media (max-width:760px){.blbar,.blbar2{grid-template-columns:1fr}}

function applyRules(){
  notes.forEach(n=>{

function tplErrors(d){
  const keys=new Set(fields.map(f=>f.k)),err=[];
  const ar=new Set([...phSet(d.title),...phSet(d.body),...phSet(d.action)]);
  const en=new Set([...phSet(d.titleEn),...phSet(d.bodyEn),...phSet(d.actionEn)]);
  [...new Set([...ar,...en])].forEach(k=>{if(!keys.has(k))err.push('الحقل {'+k+'} غير معرَّف في قاموس الحقول.');});
  [...ar].forEach(k=>{if(!en.has(k))err.push('الحقل {'+k+'} في العربية ولا يوجد في الإنجليزية.');});
  [...en].forEach(k=>{if(!ar.has(k))err.push('الحقل {'+k+'} في الإنجليزية ولا يوجد في العربية.');});
  if(d.name!==undefined&&!String(d.name).trim())err.push('اسم القالب مطلوب.');
  if(d.code!==undefined){const ce=typeCodeErr(String(d.code).trim().toUpperCase(),'__new__');if(ce)err.push(ce);}
  if(!d.title.trim()||!d.body.trim())err.push('العنوان والنص بالعربية مطلوبان.');
  if(!d.titleEn.trim()||!d.bodyEn.trim())err.push('العنوان والنص بالإنجليزية مطلوبان.');
  return err;
}

const UNIVERSE=18420;
const FAIL_WHY=['الجهاز مغلق أو خارج التغطية','الرقم غير مفعّل لدى المشغّل'];
const LS_KEY='naama_notif_batches_v4';

let contact,inbox,iid,evn,devTab,devOpen,storeOk=true;
function pad(n,w){return String(n).padStart(w,'0');}
function chsOf(t){return ['plat'].concat((t.channels||[]).filter(c=>c!=='plat'));}
function hasApp(i){return i%3!==2;}
function hasMail(i){return i%4!==1;}
function hasWa(i){return i%2===0;}
function chOutcome(ch,x,retry){
  const file=x.k==='file',i=x.i||0;
  if(ch==='plat')return file?{s:'skip',why:'غير مسجَّل على المنصة'}:{s:'ok'};
  if(ch==='app'){if(file)return {s:'skip',why:'غير مسجَّل على المنصة'};return hasApp(i)?{s:'ok'}:{s:'skip',why:'تطبيق نما غير مثبّت'};}
  if(ch==='mail'){if(file)return {s:'skip',why:'لا يوجد بريد في الملف'};if(!hasMail(i))return {s:'skip',why:'لا يوجد بريد مسجَّل'};return (!retry&&i%97===0)?{s:'fail',why:'بريد مرتد'}:{s:'ok'};}
  if(ch==='sms'){const bad=file?String(x.phone).endsWith('0'):((i+1)%50===0);return (!retry&&bad)?{s:'fail',why:FAIL_WHY[String(x.phone).charCodeAt(String(x.phone).length-1)%2]}:{s:'ok'};}
  if(ch==='wa'){if(!hasWa(i))return {s:'skip',why:'لم يوافق على واتساب'};return (!retry&&i%61===0)?{s:'fail',why:'الرقم غير مسجّل في واتساب'}:{s:'ok'};}
  return {s:'skip',why:'قناة غير معروفة'};
}
function routeSet(set,x,fb,retry){
  const out={};
  set.forEach(ch=>{out[ch]=chOutcome(ch,x,retry);});
  if(fb&&!set.includes('sms')&&out.app&&out.app.s==='skip')out.sms=Object.assign({},chOutcome('sms',x,retry),{fb:true,why:'بديل عن تطبيق نما'});
  return out;
}
function overall(o){const v=Object.keys(o).map(k=>o[k].s);return v.some(s=>s==='ok')?'ok':v.some(s=>s==='fail')?'fail':'skip';}
function demoOutcome(ch){
  if(ch==='plat'||ch==='sms')return {s:'ok'};
  if(ch==='app')return contact.app?{s:'ok'}:{s:'skip',why:'تطبيق نما غير مثبّت'};
  if(ch==='mail')return contact.mail?{s:'ok'}:{s:'skip',why:'لا يوجد بريد مسجَّل'};
  if(ch==='wa')return contact.wa?{s:'ok'}:{s:'skip',why:'لم يوافق على واتساب'};

function recipientsOf(rec){

function exportCsv(r){
  const R=recipientsOf(r),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['الدفعة','الاسم','رقم الجوال','الحالة العامة'].concat(r.chs.map(k=>CHN[k])).concat(['السبب','وقت الإرسال']);
  const lab=x=>x?({ok:'مُسلَّمة',fail:'فاشلة',skip:'مُتخطّاة',wait:'بانتظار',none:'لم تُرسل'})[x.s]:'—';
  const lines=[head.map(q).join(',')].concat(R.rows.map(x=>{
    const why=[x.why].concat(Object.keys(x.ch).map(k=>x.ch[k].why?CHN[k]+': '+x.ch[k].why:'')).filter(Boolean).join(' | ');
    return [r.no,x.name,x.phone||x.raw,recLabel(x)].concat(r.chs.map(k=>lab(x.ch[k]))).concat([why,x.st==='ok'&&x.d==='ok'?r.sentAt:'']).map(q).join(',');
  }));
  const blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=r.no+'-سجل-المستلمين.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);
}

  return rec;
}
function seedBatches(){
  const day=n=>new Date(Date.now()-n*86400000),hr=n=>new Date(Date.now()-n*3600000);
  const sp=(name,chs,segs,title,body,sms,extra,when)=>{
    const defs={};segs.forEach(id=>{const g=getDef(id);defs[id]={name:g.name,crit:g.crit};});
    const rec=Object.assign({id:-1,no:'',created:'',by:ROLES.sup,name,title,smsText:sms,chs,fbSms:false,audLabel:segs.map(id=>getDef(id).name.replace('فئة: ','')).join('، '),src:{t:'seg',segs,defs},cats:null,params:{title,body},typeId:'t7',actionLabel:'',actionUrl:'',status:'sent',at:null,sentAt:'',kind:'',parent:null,skipFrom:[],retriedNo:'',sig:chs.join(',')+'|'+title+'|'+body+'|'+sms+'|t7'},extra||{});
    return pushRec(rec,when);
  };
  const a=sp('بدء موسم تسجيل المناحل',['plat','app'],['all'],'بدء موسم تسجيل المناحل','سجّل منحلك قبل نهاية الشهر عبر منصة نما.','',{sentAt:'10:05 ص'},day(6));
  const b=sp('تذكير بتجديد الوثائق',['app','sms','mail'],['g4'],'وثيقتك تنتهي قريبًا','جدّد وثيقتك مبكرًا لتفادي تعليق الخدمات.','نما: وثيقتك تنتهي خلال 60 يومًا أو أقل. جدّدها من منصة نما.',{sentAt:'09:30 ص'},day(3));
  const c=sp('الخدمات الميسّرة لكبار السن',['sms','wa'],['g1'],'','','نما: خدمات ميسّرة لكبار السن عبر الاتصال بالرقم 939 أو زيارة منصة نما.',{sentAt:'11:15 ص'},day(2));
  const sysDefs=[['t1',148,26,'s6'],['q2',64,12,'s10'],['w4',320,5,'s6'],['w6',900,2,'s7']];
  sysDefs.forEach(([id,n,h,sy])=>{const t=types.find(x=>x.id===id);const r=pushRec(sysBatch(t,n,undefined,sy),hr(h));r.sentAt=hr(h).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});});
  const sch=sp('تذكير تحصين مربي الإبل',['app','sms','wa'],['g2'],'حملة تحصين الإبل','موعد التحصين يبدأ الأسبوع القادم.','نما: حملة تحصين الإبل تبدأ الأسبوع القادم. تفاصيل الموعد في تطبيق نما.',{status:'scheduled',at:Date.now()+26*3600000},hr(1));
  const can=sp('تجربة: جمعيات تطوعية',['sms'],['c4'],'','','نما: رسالة تجريبية.',{status:'cancelled'},day(1));
  RC.clear();
  [a,b,c].forEach(r=>{r.status='sent';});
  persist();
}

function histHTML(){
  const stChip={sent:['ok','أُرسلت'],scheduled:['upd','مجدولة'],cancelled:['exp','أُلغيت']};
  const q=(ui.hq||'').trim().toLowerCase();
  const list=sends.filter(r=>{
    if(ui.hf==='manual'&&r.sysSrc)return false;
    if(ui.hf==='system'&&!r.sysSrc)return false;
    if(ui.hf==='scheduled'&&r.status!=='scheduled')return false;
    if(ui.hf==='fail'&&!(r.status==='sent'&&cnt(r).fail>0))return false;

    const c=cnt(r),d=dis(can('send'));let acts=`<button class="btn sm p" type="button" data-h="open" data-id="${r.id}">فتح السجل</button>`;

const BFIL={all:'الكل',ok:'استلم',fail:'فشل ولم يستلم',skip:'لا قناة متاحة',wait:'بانتظار الموعد',excl:'مستبعد'};
function rowStatus(r,x){
  if(x.st==='invalid')return chipStat('exp','مستبعد: رقم غير صالح');
  if(x.st==='dup')return chipStat('warn','مستبعد: مكرر');
  if(x.st==='prev')return chipStat('warn','مستبعد: استلم سابقًا');
  if(x.d==='ok')return chipStat('ok','استلم');
  if(x.d==='fail')return chipStat('pri','لم يستلم: فشل')+(r.retriedNo?` <small class="k" style="display:inline">أُعيدت في ${r.retriedNo}</small>`:'');
  if(x.d==='skip')return chipStat('exp','لم يستلم: لا قناة متاحة');
  if(x.d==='wait')return chipStat('upd','بانتظار الموعد');
  return chipStat('exp','لم تُرسل');
}
function whyOf(x){
  const p=[];if(x.why)p.push(x.why);
  Object.keys(x.ch||{}).forEach(k=>{const o=x.ch[k];if(o.why&&o.s!=='ok')p.push(CHN[k]+': '+o.why);});
  return p.join(' · ');
}
function filteredRows(r){
  const R=recipientsOf(r),f=ui.bv.filter,q=(ui.bv.q||'').trim(),cf=ui.bv.ch||'all';
  return R.rows.filter(x=>{
    if(cf!=='all'){
      if(x.st!=='ok'||!x.ch[cf])return false;
      if(f==='excl')return false;
      if(['ok','fail','skip','wait'].includes(f)&&x.ch[cf].s!==f)return false;
    }else{
      if(f==='ok'&&!(x.st==='ok'&&x.d==='ok'))return false;
      if(f==='fail'&&!(x.st==='ok'&&x.d==='fail'))return false;
      if(f==='skip'&&!(x.st==='ok'&&x.d==='skip'))return false;
      if(f==='wait'&&!(x.st==='ok'&&x.d==='wait'))return false;
      if(f==='excl'&&x.st==='ok')return false;
    }
    if(q&&!((x.phone||'').includes(q.replace(/^0/,'966'))||(x.raw||'').includes(q)||(x.name||'').includes(q)))return false;
    return true;
  });
}
function rowsHTML(r){
  const rows=filteredRows(r),pages=Math.max(1,Math.ceil(rows.length/PAGE));
  if(ui.bv.page>pages)ui.bv.page=pages;
  const from=(ui.bv.page-1)*PAGE,slice=rows.slice(from,from+PAGE);
  const body=slice.length?slice.map((x,i)=>`<tr><td>${from+i+1}</td><td>${esc(x.name||'—')}</td><td dir="ltr" class="ph">${esc(x.phone||x.raw||'—')}</td><td>${rowStatus(r,x)}</td><td><div class="chs">${Object.keys(x.ch||{}).map(k=>chChip(Object.assign({ch:k},x.ch[k]))).join('')||'—'}</div></td><td>${esc(whyOf(x))}</td></tr>`).join(''):'<tr><td colspan="6" class="e">لا نتائج.</td></tr>';
  return {body,pager:`${rows.length.toLocaleString('ar')} نتيجة · صفحة ${ui.bv.page} من ${pages}`,pages};
}

function applySendState(el){
  const s=ui.send;
  if(el.dataset.sp){s.params[el.dataset.sp]=el.value;return;}
  if(el.dataset.ch2){s.chs[el.dataset.ch2]=el.checked;if(!s.chs.app)s.fbSms=false;s.review=false;s.msg='';return;}
  const k=el.dataset.sd;
  if(el.type==='checkbox')s[k]=el.checked;else s[k]=el.value;
  if(k==='tplId'){
    s.params={};
    const t=types.find(x=>x.id===s.tplId);
    if(t){
      s.params=Object.assign({},(t.sample&&t.sample[0])||{});
      const keep=false;
      CHS.forEach(([c])=>{s.chs[c]=false;});
      chsOf(t).forEach(c=>{if(!(keep&&['plat','app','mail'].includes(c)))s.chs[c]=true;});
      if(keep&&!s.chs.sms&&!s.chs.wa)s.chs.sms=true;
      s.fbSms=!!t.fbSms&&s.chs.app&&!s.chs.sms;
    }
  }
  s.review=false;s.msg='';
}

function tabDash(){

    .concat(I.mode==='bulk'||I.mode==='batch'?[['correlationId','نعم (دفعة)','مرجع الدفعة في نظامكم، لتتبعها','<code>'+sysCode(I.src)+'-…</code>'],['options.digest','لا','دمج الرسائل النصية وواتساب والبريد في رسالة واحدة لكل مستفيد إن تعددت عناصره، بينما يبقى إشعار المنصة والتطبيق منفصلًا لكل عنصر','<code>true</code>'],['notifications[]','نعم (دفعة)','قائمة الإشعارات (حتى 100 في الطلب)، لكل منها idempotencyKey وto وdata وaction','—']]:[])

  let res='';

    <p class="hint">افتح «سجل الأحداث المستلمة» لترى كل حدث بقنواته، و«إرسال الحملات عبر القنوات» لترى الدفعة المرقّمة. المستفيد التجريبي في هذا النموذج هو الهوية <code>${DEMO_ID}</code>، فتظهر إشعاراته في الواجهة الأمامية وفي «أجهزة المستفيد».</p>`;

Authorization: Bearer {{API_KEY}}</pre>

/* ---- محاكاة استقبال الطلب في المركز ---- */
const replay={};
function apiErr(http,code,message,field){return {code:http,body:{error:Object.assign({code,message},field?{details:[{field,issue:message}]}:{})}};}
function itemErr(key,status,code,message,field){return {idempotencyKey:key||'—',status,error:Object.assign({code,message},field?{field}:{})};}
function apiHandle(text){
  let b;try{b=JSON.parse(text);}catch(e){return apiErr(400,'INVALID_REQUEST','الجسون غير صالح: '+e.message);}
  const t=types.find(x=>x.code===b.template);
  if(!t)return apiErr(404,'TEMPLATE_NOT_FOUND','القالب «'+b.template+'» غير معرّف في الكتالوج.','template');
const so=srcByCode(b.source);
  if(!so){log('reject','رُفض الطلب: النظام «'+(b.source||'—')+'» غير مسجَّل لدى المركز.',b.source||'—',t.name,null,'',null,Object.assign(lx(t,'',''),{sc:b.source||''}));return apiErr(403,'FORBIDDEN','النظام غير مسجَّل لدى المركز.');}
  if(!t.active||!so.active){log('reject','رُفض الطلب: القالب أو النظام موقوف.',so.name,t.name,null,'',null,lx(t,'',so.id));return apiErr(403,'FORBIDDEN','القالب أو النظام موقوف.');}
  const isBulk=Array.isArray(b.notifications),list=isBulk?b.notifications:[b];
  if(!list.length)return apiErr(400,'INVALID_REQUEST','قائمة notifications فارغة.','notifications');
  if(isBulk&&list.length>100)return apiErr(400,'INVALID_REQUEST','الحد الأقصى 100 إشعار في الطلب الواحد.','notifications');
  const need=[...phSet(t.title+' '+t.body)],out=[];let acc=0,dup=0,rej=0;
  const reject=(key,code,msg,field,lg)=>{rej++;out.push(itemErr(key,'REJECTED',code,msg,field));log('reject','رُفض عنصر: '+(lg||msg),so.name,t.name,null,'',null,lx(t,'',so.id));};
  list.forEach(it=>{
    const key=it.idempotencyKey,ben=it.to&&it.to.userId,d=it.data||{};
    if(!key)return reject(key,'VALIDATION_ERROR','idempotencyKey مفقود','idempotencyKey');
    if(!ben)return reject(key,'VALIDATION_ERROR','to.userId مفقود','to.userId');
    for(const k of need){
      const v=d[k];
      if(isLoc(k)){
        if(!v||typeof v!=='object'||!String(v.ar||'').trim()||!String(v.en||'').trim())return reject(key,'VALIDATION_ERROR','الحقل '+k+' يتطلب النص بالعربية والإنجليزية {ar,en}','data.'+k);
      }else if(v===undefined||String(v).trim()==='')return reject(key,'VALIDATION_ERROR','قيمة ناقصة: '+k,'data.'+k);
    }
    const ae=actionErr(so.id,it.action);if(ae)return reject(key,'VALIDATION_ERROR',ae,'action',ae);
    if(t.dedupe&&seen.has(key)){dup++;out.push(Object.assign(itemErr(key,'DUPLICATE','DUPLICATE','وصل من قبل، لم يُرسل'),{requestId:replay[key]||undefined}));log('dup','تجاهل: الحدث '+key+' وصل من قبل، فلا يتكرر.',so.name,t.name,null,'',null,lx(t,ben,so.id));return;}
    const p={};Object.keys(d).forEach(k=>{p[k]=(d[k]&&typeof d[k]==='object')?d[k].ar:d[k];});
    if(String(ben)===DEMO_ID){emit({key,typeId:t.id,srcId:so.id,params:p,action:it.action});}
    else{seen.add(key);log('ok','وصل إشعار «'+t.name+'» لمستفيد آخر ('+ben+') عبر '+chsOf(t).map(c=>CHN[c]).join('، ')+'.',so.name,t.name,seedRoute(t,Number(String(ben).slice(-5))||1),'هوية '+ben,null,lx(t,ben,so.id));}
    acc++;replay[key]=eventLog[0]&&eventLog[0].no;out.push({idempotencyKey:key,status:'ACCEPTED',requestId:replay[key]});
  });
  if(!isBulk){
    const o=out[0];
    if(o.status==='ACCEPTED')return {code:202,body:{requestId:eventLog[0]&&eventLog[0].no,status:'ACCEPTED',channels:chsOf(t).map(c=>CH_API[c])}};
    if(o.status==='DUPLICATE')return {code:202,body:{requestId:replay[o.idempotencyKey]||'EV-000001',status:'ACCEPTED',replayed:true,channels:chsOf(t).map(c=>CH_API[c])}};
    return apiErr(422,o.error.code,o.error.message,o.error.field);
  }
  const body={status:acc?'ACCEPTED':'REJECTED',summary:{received:list.length,accepted:acc,duplicate:dup,rejected:rej}};
  if(acc>0){const rec=sysBatch(t,acc,undefined,so.id);rec.name=b.correlationId||(t.name+' (دفعة من النظام)');rec.sentAt=nowStr();rec.kind='دفعة عبر الـ API من «'+so.name+'»';pushRec(rec);audit('استُقبلت دفعة عبر API',rec.no+' · '+acc+' عنصرًا',typeCode(t));body.batchId=rec.no;}
  body.results=out;
  return {code:acc?202:(dup&&!rej?200:422),body};
}
function apiStatus(rid){
  const e=eventLog.find(x=>x.no===rid&&x.k==='ok');
  if(!e)return apiErr(404,'REQUEST_NOT_FOUND','لا طلب مقبول بالمعرّف «'+(rid||'—')+'».','requestId');
  const ch=(e.chs||[]).map(o=>({channel:CH_API[o.ch],status:o.s==='ok'?'DELIVERED':o.s==='fail'?'FAILED':'SKIPPED'}));
  const d=ch.filter(x=>x.status==='DELIVERED').length,f=ch.filter(x=>x.status==='FAILED').length;
  const st=f?(d?'PARTIAL':'FAILED'):(d?'DELIVERED':'SKIPPED');
  return {code:200,body:{requestId:e.no,status:st,source:e.sc,template:e.tc,to:{userId:e.uid},channels:ch,receivedAt:e.time}};
}
function copyText(txt){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>toast('نُسخ')).catch(()=>fallbackCopy(txt));return;}}catch(e){}
  fallbackCopy(txt);
}
function fallbackCopy(txt){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}a.remove();toast(ok?'نُسخ':'تعذّر النسخ، حدّد النص وانسخه يدويًا');}
function intSel(el){
  const I=intState();
  if(el.dataset.is){I.src=el.value;}
  else if(el.dataset.it)I.type=el.value;
  else if(el.dataset.im)I.mode=el.value;
  I.text=pretty(intGen());I.res=null;renderAdm();
}
function intAction(b){
  const I=intState(),A=b.dataset.i,t=types.find(x=>x.id===I.type);
  if(A==='copy'){const k=b.dataset.k;copyText(k==='json'?I.text:k==='curl'?intCurl(I):intResp(I,t));}
  else if(A==='regen'){I.text=pretty(intGen());I.res=null;renderAdm();}
  else if(A==='send'){I.res=apiHandle(I.text);const bd=I.res.body,rq=bd.requestId||((bd.results||[]).find(x=>x.requestId)||{}).requestId;if(rq){I.rid=rq;I.sres=null;}renderAdm();renderBen();renderDev();}
  else if(A==='status'){const v=$('#i-rid');I.rid=v?v.value.trim():(I.rid||'');I.sres=apiStatus(I.rid);renderAdm();}
  else if(A==='dl'){const blob=new Blob([I.text],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=typeCode(t)+'-request.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),500);}
}

const TABFN={dash:tabDash,srcs:tabSrcs,fields:tabFields,tpl:tabTpl,send:tabSend,segs:tabSegs,events:tabEvents,audit:tabAudit,ret:tabRet,src:tabSrc,int:tabInt};

function pingBell(){const bell=$('#bell');if(bell){bell.classList.remove('ping');void bell.offsetWidth;bell.classList.add('ping');}}
const admMain=$('#admMain');
function isText(el){return el.tagName==='TEXTAREA'||['text','search','tel','number'].includes(el.type);}
admMain.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.f){
    const f=el.dataset.f;ui.draft[f]=el.type==='checkbox'?el.checked:(f==='autoExp'?Math.max(0,parseInt(el.value,10)||0):(f==='code'?el.value.toUpperCase():el.value));
    if(el.type!=='checkbox'&&el.tagName!=='SELECT'){const keep=el.id,pos=el.selectionStart;renderAdm();const n=document.getElementById(keep);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}}
    return;
  }
  if(el.dataset.t){
    const p=types.find(x=>x.id===ui.tsel).tpl;if(p.status!=='draft')return;
    p.draft[el.dataset.t]=el.dataset.t==='code'?el.value.toUpperCase():el.value;const keep=el.id,pos=el.selectionStart;renderAdm();const n=document.getElementById(keep);if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(_){}}return;
  }
  if(el.dataset.r){retention[el.dataset.r]=Math.max(1,parseInt(el.value,10)||1);renderBen();const n=$('#ret-n');if(n)n.textContent=archivedCount();return;}
  if(el.dataset.gf){const k=el.dataset.gf;if(k==='name'||k==='desc')ui.sg.draft[k]=el.value;else ui.sg.draft.crit[k]=el.value===''?undefined:el.value;updateSegPreview();return;}
  if(el.dataset.bq){ui.bv.q=el.value;ui.bv.page=1;renderRows();return;}
  if(el.dataset.ij){ui.int.text=el.value;return;}
  if(el.dataset.gdq){const q=el.value.trim().toLowerCase();document.querySelectorAll('#docList label').forEach(l=>{l.hidden=!!q&&!l.dataset.q.toLowerCase().includes(q);});return;}
  if(el.dataset.simn){simN=Math.max(1,Math.min(5000,parseInt(el.value,10)||1));return;}
  if(el.dataset.hq){ui.hq=el.value;refreshHist();return;}
  if((el.dataset.sd||el.dataset.sp)&&isText(el)){
    const hadRev=ui.send.review;applySendState(el);
    const pc=$('#sdPrev');if(pc)pc.innerHTML=prevCol(ui.send);
    if(hadRev){const keep=el.id,pos=el.selectionStart;renderAdm();const n2=document.getElementById(keep);if(n2){n2.focus();try{n2.setSelectionRange(pos,pos);}catch(_){}}}
  }
});
function renderPlatPreviewOnly(){ /* المعاينة تتحدث عند أي تغيير غير نصي؛ نترك النص بلا إعادة رسم حفاظًا على المؤشر */ }
admMain.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.is||el.dataset.it||el.dataset.im){intSel(el);return;}
  if(el.dataset.simsys){ui.simSys=el.value;renderAdm();return;}
  if(el.dataset.ch2){applySendState(el);renderAdm();return;}
  if(el.dataset.chx){const k=el.dataset.chx,d=ui.draft;let a=(d.channels||['plat']).filter(x=>x!==k&&x!=='plat');if(el.checked)a.push(k);d.channels=['plat'].concat(a);return;}
  if(el.dataset.hf){ui.hf=el.value;refreshHist();return;}
  if(el.dataset.bc){ui.bv.ch=el.value;ui.bv.page=1;renderAdm();return;}
  if(el.dataset.ef){ui.ef=el.value;renderAdm();return;}
  if(el.dataset.es){ui.es=el.value;renderAdm();return;}
  if(el.dataset.simn){renderAdm();return;}
  if(el.dataset.f){if(el.tagName==='SELECT'){ui.draft[el.dataset.f]=el.value;renderAdm();}return;}
  if(el.dataset.r){audit('تعديل مدة الاحتفاظ',GROUPS[el.dataset.r]+' = '+retention[el.dataset.r]+' يومًا');return;}
  if(el.dataset.gc){const k=el.dataset.gc,v=el.dataset.v,c=ui.sg.draft.crit;c[k]=c[k]||[];if(el.checked){if(!c[k].includes(v))c[k].push(v);}else c[k]=c[k].filter(x=>x!==v);updateSegPreview();return;}
  if(el.dataset.gr){ui.sg.draft.crit.ret=el.checked;updateSegPreview();return;}
  if(el.dataset.bf){ui.bv.filter=el.value;ui.bv.page=1;renderAdm();return;}
  if(el.dataset.skip){ui.send.skipPrev=el.checked;return;}
  if(el.dataset.seg){
    const s=ui.send,id=el.dataset.seg;
    if(el.checked){if(id==='all')s.segs=['all'];else s.segs=s.segs.filter(x=>x!=='all').concat(id);}else s.segs=s.segs.filter(x=>x!==id);
    s.review=false;renderAdm();return;
  }
  if(el.dataset.rs){ui.resched.val=el.value;return;}
  if((el.dataset.sd||el.dataset.sp)&&!isText(el)){applySendState(el);renderAdm();}
});
admMain.addEventListener('click',e=>{
  const b=e.target.closest('[data-e],[data-s],[data-sa],[data-sn],[data-h],[data-g],[data-i]');if(!b)return;
  const E=b.dataset.e;
  if(E!=='srcdel'&&E!=='tdel'&&ui.delC){ui.delC=null;renderAdm();}
  if(E==='sel'){}
  else if(E==='snew'){ui.srcNew=true;renderAdm();window.scrollTo({top:0});}
  else if(E==='sback'){ui.srcNew=false;renderAdm();}
  else if(E==='fnew'){ui.fldNew=true;renderAdm();window.scrollTo({top:0});}
  else if(E==='fback'){ui.fldNew=false;renderAdm();}
  else if(E==='tog'){const t=types.find(x=>x.id===b.dataset.id);t.active=!t.active;if(ui.draft&&ui.draft.id===t.id)ui.draft.active=t.active;audit(t.active?'تفعيل قالب':'إيقاف قالب',t.name,typeCode(t));renderAdm();}
  else if(E==='save'){const i=types.findIndex(t=>t.id===ui.tsel);const keep=types[i];const nm=(ui.draft.name||'').trim();if(!nm){toast('اكتب اسم القالب');return;}types[i]=Object.assign({},keep,{name:nm,group:ui.draft.group,countBell:ui.draft.countBell,dedupe:ui.draft.dedupe,autoExp:ui.draft.autoExp,channels:chsOf(ui.draft),fbSms:!!ui.draft.fbSms});audit('تعديل إعدادات قالب',types[i].name,typeCode(types[i]));renderBen();renderAdm();toast('حُفظت الإعدادات. تسري على الإشعارات القادمة، وقواعد الانتهاء والعدّاد تسري فورًا.');}
  else if(E==='srcdel'){const id=b.dataset.id;if(ui.delC!=='s:'+id){ui.delC='s:'+id;renderAdm();return;}const x=sources.find(y=>y.id===id);sources=sources.filter(y=>y.id!==id);ui.delC=null;if(ui.int&&ui.int.src===id)ui.int=null;if(ui.simSys===id)ui.simSys=null;audit('حذف نظام مصدِّر',x.name,x.code);renderBen();renderAdm();toast('حُذف النظام.');}
  else if(E==='tdel'){const id=b.dataset.id;if(ui.delC!=='t:'+id){ui.delC='t:'+id;renderAdm();return;}const x=types.find(y=>y.id===id);types=types.filter(y=>y.id!==id);notes=notes.filter(n=>n.typeId!==id);sends=sends.filter(r=>r.typeId!==id);ui.delC=null;ui.tplEdit=false;if(ui.int&&ui.int.type===id)ui.int=null;audit('حذف قالب',x.name,x.code);persist();renderBen();renderAdm();toast('حُذف القالب.');}
  else if(E==='srctog'){const s=sources.find(x=>x.id===b.dataset.id);s.active=!s.active;audit(s.active?'تفعيل مصدر':'إيقاف مصدر',s.name,s.code);renderAdm();}
  else if(E==='fdel'){fields=fields.filter(f=>f.k!==b.dataset.id);audit('حذف حقل','{'+b.dataset.id+'}');renderAdm();}
  else if(E==='tsel'){ui.tsel=b.dataset.id;ui.tplEdit=true;ui.draft=cloneT(types.find(x=>x.id===ui.tsel));renderAdm();window.scrollTo({top:0});}
  else if(E==='tlist'){ui.tplEdit=false;renderAdm();}
  else if(E==='tpnew'){const id='t'+(types.length+1+Math.floor(Math.random()*90)),t=newType(id);t.active=false;t.isNew=true;t.tpl.ver=0;t.tpl.hist=[];t.tpl.status='draft';t.code='';t.tpl.draft={name:'',code:'',group:'upd',title:'',body:'',action:'',titleEn:'',bodyEn:'',actionEn:''};types.push(t);ui.tsel=id;ui.tplEdit=true;ui.draft=cloneT(t);audit('إنشاء قالب جديد','مسودة');renderAdm();}
  else if(E==='tnew'){const t=types.find(x=>x.id===ui.tsel);t.tpl.status='draft';t.tpl.retNote='';t.tpl.draft={title:t.title,body:t.body,action:t.action,titleEn:t.titleEn,bodyEn:t.bodyEn,actionEn:t.actionEn};audit('إنشاء مسودة قالب',t.name);renderAdm();}
  else if(E==='tsubmit'){const t=types.find(x=>x.id===ui.tsel);t.tpl.status='review';audit('إرسال قالب للمراجعة',t.name,typeCode(t));renderAdm();toast('أُرسل القالب للمراجعة');}
  else if(E==='tdrop'){const t=types.find(x=>x.id===ui.tsel);if(t.isNew){types.splice(types.indexOf(t),1);ui.tplEdit=false;audit('تجاهل قالب جديد','مسودة');}else{t.tpl.status='published';t.tpl.draft=null;audit('تجاهل مسودة قالب',t.name);}renderAdm();}
  else if(E==='tret'){const t=types.find(x=>x.id===ui.tsel);t.tpl.status='draft';t.tpl.retNote='يحتاج توضيحًا';audit('إرجاع قالب للمسودة',t.name,typeCode(t));renderAdm();}
  else if(E==='tpub'){
    const t=types.find(x=>x.id===ui.tsel),d=t.tpl.draft;
    Object.assign(t,{title:d.title,body:d.body,action:d.action,titleEn:d.titleEn,bodyEn:d.bodyEn,actionEn:d.actionEn});
    if(t.isNew){Object.assign(t,{name:d.name.trim(),code:String(d.code).trim().toUpperCase(),group:d.group,active:true});delete t.isNew;}
    t.tpl.ver++;t.tpl.hist.unshift({v:t.tpl.ver,label:'نُشر',by:ROLES[role]});t.tpl.status='published';t.tpl.draft=null;t.tpl.retNote='';
    audit('اعتماد ونشر قالب',t.name+' v'+t.tpl.ver,typeCode(t));renderBen();renderAdm();toast('نُشر القالب v'+t.tpl.ver+'. يسري على الإشعارات القادمة.');
  }
  else if(b.dataset.s==='ev'||b.dataset.s==='evdup'){emitType(b.dataset.id,b.dataset.s==='ev',b.dataset.sys);renderAdm();}
  else if(b.dataset.s==='evb'){
    const t=types.find(x=>x.id===b.dataset.id),sy=b.dataset.sys||hs(t),so=sources.find(x=>x.id===sy);
    if(!t.active||!so.active){log('reject','رُفضت الدفعة: القالب أو مصدره موقوف.',srcName(sy),t.name,null,'',null,lx(t,'',sy));renderAdm();return;}
    const r=pushRec(sysBatch(t,simN,undefined,sy));execSend(r,true);
    log('ok','دفعة '+r.no+': '+simN.toLocaleString('ar')+' مستفيدًا للقالب «'+t.name+'» عبر '+chLabel(r)+'.',srcName(sy),t.name,null,simN+' مستفيد',null,lx(t,'',sy));
    toast('أُنشئت الدفعة '+r.no+' وتجدها في «إرسال الحملات»');renderAdm();
  }
  else if(b.dataset.s==='resolve'){
    const x=notes.filter(n=>n.typeId==='t1'&&!n.deleted&&n.status!=='done').sort((a,c)=>a.ts-c.ts)[0];
    if(x){x.status='done';x.auto=false;log('ok','تحوّل أحدث إشعار «مُرجَع» إلى «تم الإجراء» وفقد بروزه.','دورة الطلب','طلب مُرجَع لاستكمال مرفق');renderBen();toast('تحدّثت حالة إشعار عند المستفيد');}
    else log('dup','لا يوجد إشعار «مُرجَع» مفتوح.','دورة الطلب','طلب مُرجَع لاستكمال مرفق');
    renderAdm();
  }
  else if(b.dataset.s==='expire'){
    const x=notes.filter(n=>n.typeId==='t6'&&!n.deleted&&n.status!=='expired').sort((a,c)=>a.ts-c.ts)[0];
    if(x){x.status='expired';x.auto=false;log('ok','تحوّل أحدث إشعار دعوة إلى «منتهٍ».','مجتمع نما (F12)','دعوة من مجتمع نما');renderBen();toast('تحدّثت حالة إشعار عند المستفيد');}
    else log('dup','لا توجد دعوة جارية.','مجتمع نما (F12)','دعوة من مجتمع نما');
    renderAdm();
  }
  else if(b.dataset.s==='unauth'){emit({typeId:'t1',srcId:'s3',params:{service:'اختبار',doc:'اختبار'}});renderAdm();}
  else if(b.dataset.s==='unknown'){emit({typeId:'tX',srcId:'s4',params:{}});renderAdm();}
  else if(b.dataset.i){intAction(b);}
  else if(b.dataset.sn){ui.sendNew=b.dataset.sn==='new';if(ui.sendNew){ui.send=newSend();ui.showErr=false;}ui.bv=null;renderAdm();}
  else if(b.dataset.sa){
    const s=ui.send,A=b.dataset.sa;
    if(A==='copysms'){s.smsText=(s.title?s.title+' — ':'')+s.body;renderAdm();}
    else if(A==='review'){ui.showErr=true;if(sendErrors(s).length){renderAdm();return;}s.review=true;renderAdm();}
    else if(A==='back'){s.review=false;renderAdm();}
    else if(A==='confirm'){
      if(sendErrors(s).length){s.review=false;ui.showErr=true;renderAdm();return;}
      const po=prevOverlap(s);
      const extra=s.when==='later'?{status:'scheduled',at:new Date(s.at).getTime()}:{};
      if(po.n>0&&s.skipPrev)extra.skipFrom=po.ids;
      const r=pushRec(buildRec(s,extra));
      if(s.when==='later'){audit('جدولة دفعة',r.no+' · '+fmtAt(r.at));persist();toast('جُدولت الدفعة '+r.no);}
      else execSend(r);
      ui.send=newSend();ui.sendNew=false;ui.showErr=false;ui.bv={id:r.id,page:1,filter:'all',q:'',confirmAll:false};renderAdm();window.scrollTo({top:0});
    }
  }
  else if(b.dataset.g){
    const G=b.dataset.g;
    if(G==='manage'){ui.tab='segs';ui.sg=null;renderAdm();}
    else if(G==='new'){ui.sg={edit:'new',draft:{name:'',desc:'',crit:{}},err:''};renderAdm();updateSegPreview();}
    else if(G==='edit'){const g=segById(b.dataset.id);ui.sg={edit:g.id,draft:{name:g.name,desc:g.desc||'',crit:JSON.parse(JSON.stringify(g.crit))},err:''};renderAdm();updateSegPreview();}
    else if(G==='cancel'){ui.sg=null;renderAdm();}
    else if(G==='del'){const g=segById(b.dataset.id);segList=segList.filter(x=>x.id!==b.dataset.id);saveSegs();audit('حذف شريحة',g?g.name:b.dataset.id);toast('حُذفت الشريحة. سجل الدفعات السابقة لم يتغيّر.');renderAdm();}
    else if(G==='use'){ui.send.aud='seg';ui.send.segs=[b.dataset.id];ui.send.review=false;ui.bv=null;ui.tab='send';renderAdm();toast('اختيرت الشريحة في نموذج الإرسال');}
    else if(G==='save'){
      const d=ui.sg.draft,c=normCrit(d.crit),name=d.name.trim();let err='';
      if(!name)err='اكتب اسم الشريحة.';
      else if(!Object.keys(c).length)err='حدّد معيارًا واحدًا على الأقل.';
      else if(allSegs().some(x=>x.name===name&&x.id!==ui.sg.edit))err='اسم الشريحة مستخدم.';
      else if(members(c).length===0)err='لا يوجد مستفيد تنطبق عليه هذه المعايير.';
      if(err){ui.sg.err=err;const e=$('#sgErr');e.textContent=err;e.hidden=false;return;}
      if(ui.sg.edit==='new'){segList.push({id:'g'+(++gid),name,desc:d.desc.trim(),crit:c,by:ROLES[role]});audit('إنشاء شريحة',name);}
      else{const g=segList.find(x=>x.id===ui.sg.edit);g.name=name;g.desc=d.desc.trim();g.crit=c;audit('تعديل شريحة',name);}
      saveSegs();ui.sg=null;toast('حُفظت الشريحة');renderAdm();
    }
  }
  else if(b.dataset.h){
    const H=b.dataset.h,r=b.dataset.id?sends.find(x=>x.id===+b.dataset.id):null;
    const openB=n=>{ui.bv={id:n.id,page:1,filter:'all',q:'',confirmAll:false};renderAdm();};
    if(H==='open'){openB(r);window.scrollTo({top:0});}
    else if(H==='back'){ui.bv=null;renderAdm();}
    else if(H==='now'){r.at=Date.now();execSend(r);if(ui.bv)renderAdm();else refreshHist();}
    else if(H==='cancel'){r.status='cancelled';RC.delete(r.id);audit('إلغاء جدولة',r.no);persist();toast('أُلغيت الجدولة');if(ui.bv)renderAdm();else refreshHist();}
    else if(H==='resched'){const d=new Date(r.at-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16);ui.resched={id:r.id,val:d};refreshHist();}
    else if(H==='rcancel'){ui.resched=null;refreshHist();}
    else if(H==='rsave'){const t=new Date(ui.resched.val).getTime();if(!(t>Date.now())){toast('الموعد يجب أن يكون في المستقبل');return;}r.at=t;audit('تعديل موعد جدولة',r.no+' · '+fmtAt(t));persist();ui.resched=null;refreshHist();toast('عُدّل الموعد');}
    else if(H==='resendfail'){
      const F=recipientsOf(r).rows.filter(x=>x.st==='ok'&&x.d==='fail');
      const items=F.map(x=>({name:x.name,phone:x.phone,i:x.i,fo:x.k==='file',chs:Object.keys(x.ch).filter(k=>x.ch[k].s==='fail')}));
      const chs=[...new Set([].concat(...items.map(i=>i.chs)))];
      const n=pushRec(Object.assign({},r,{status:'sent',at:null,kind:'إعادة للفاشلين من '+r.no,parent:r.id,chs,fbSms:false,name:'إعادة: '+r.name,audLabel:'الفاشلون من '+r.no,src:{t:'retry',items},skipFrom:[],retriedNo:'',sentAt:'',cats:null,sysSrc:undefined,sig:'retry|'+r.no}));
      execSend(n,true);r.retriedNo=n.no;RC.delete(r.id);persist();openB(n);toast('أُعيد الإرسال على القنوات الفاشلة فقط: '+n.no);
    }
    else if(H==='copy'){
      const s=newSend();CHS.forEach(([k])=>{s.chs[k]=r.chs.includes(k);});s.name=r.name;s.title=r.title;s.smsText=r.smsText;s.actionLabel=r.actionLabel||'';s.actionUrl=r.actionUrl||'';s.fbSms=!!r.fbSms;
      if(r.typeId!=='t7'){s.tplId=r.typeId;s.params=Object.assign({},r.params);}else s.body=r.params.body||'';
      ui.send=s;ui.bv=null;renderAdm();toast('نُسخت الإعدادات إلى نموذج جديد');
    }
    else if(H==='export'){exportCsv(r);}
    else if(H==='pg'){ui.bv.page+=+b.dataset.d;renderRows();}
    else if(H==='reseed'){sends=[];sid=0;RC.clear();seedBatches();ui.bv=null;renderAdm();toast('استُعيدت الحملات التجريبية');}
    else if(H==='clearall'){sends=[];sid=0;RC.clear();persist();ui.bv=null;renderAdm();toast('مُسحت الدفعات المحفوظة');}
  }
});
admMain.addEventListener('submit',e=>{
  e.preventDefault();
  const id=e.target.id;
  if(id==='sf'){
    const n=$('#s-name').value.trim(),o=$('#s-owner').value.trim();if(!n||!o){toast('اكتب الاسم والجهة المالكة');return;}
    const sc=$('#s-code').value.trim().toUpperCase(),sce=srcCodeErr(sc);if(sce){toast(sce);return;}
    sources.push({id:'s'+(sources.length+1+Math.floor(Math.random()*90)),code:sc,name:n,owner:o,active:true});audit('تسجيل نظام مصدِّر',n,sc);ui.srcNew=false;renderAdm();toast('سُجّل النظام.');
  }else if(id==='ff'){
    const k=$('#n-k').value.trim(),l=$('#n-l').value.trim(),x=$('#n-e').value.trim(),m=$('#ff-msg');
    if(!/^[A-Za-z]\w*$/.test(k)){m.textContent='اسم الحقل أحرف لاتينية وأرقام بلا مسافات.';return;}
    if(fields.some(f=>f.k===k)){m.textContent='الحقل موجود.';return;}
    if(!l){m.textContent='اكتب معنى الحقل.';return;}
    fields.push({k,label:l,ex:x||'—',loc:$('#n-loc').checked});audit('إضافة حقل','{'+k+'}');ui.fldNew=false;renderAdm();toast('أُضيف الحقل.');
  }
});
admMain.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.closest('#sdf')&&e.target.tagName==='INPUT')e.preventDefault();});

$('#reset').addEventListener('click',()=>{try{localStorage.removeItem(LS_KEY);localStorage.removeItem(LS_SEG);}catch(e){}init();renderAdm();renderBen();renderDev();});
$('#devBtn').addEventListener('click',()=>{devOpen=!devOpen;renderDev();});
$('#dev').addEventListener('click',e=>{const b=e.target.closest('[data-dt],[data-dc]');if(!b)return;if(b.dataset.dt){devTab=b.dataset.dt;renderDev();}else{devOpen=false;renderDev();}});
$('#dev').addEventListener('change',e=>{const k=e.target.dataset.ct;if(k){contact[k]=e.target.checked;toast('تغيّر إعداد جهاز المستفيد، ويسري على الإرسال القادم');}});
init();renderAdm();renderBen();renderDev();
</script>
</body>
</html>
